name: Build modules

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TITANIUM_SDK: 13.4.1.GA

jobs:
  android:
    name: Android module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Titanium CLI and SDK
        run: |
          npm install -g titanium
          ti sdk install ${{ env.TITANIUM_SDK }} --force
          ti config android.sdkPath "$ANDROID_SDK_ROOT"

      - name: Build Android module
        working-directory: android
        run: ti build -p android --build-only --sdk ${{ env.TITANIUM_SDK }}

      - uses: actions/upload-artifact@v7
        with:
          name: ti.game-android
          path: android/dist/*.zip
          if-no-files-found: error

  ios:
    name: iOS module
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Titanium CLI and SDK
        run: |
          npm install -g titanium
          ti sdk install ${{ env.TITANIUM_SDK }} --force

      - name: Build iOS module
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ti-game-sdk.xcconfig" <<CONFIG
          TITANIUM_SDK_VERSION = ${{ env.TITANIUM_SDK }}
          CONFIG
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/ti-game-sdk.xcconfig" ti build -p ios --build-only --sdk ${{ env.TITANIUM_SDK }}

      - uses: actions/upload-artifact@v7
        with:
          name: ti.game-ios
          path: ios/dist/*.zip
          if-no-files-found: error

  nightly:
    name: Nightly release
    needs: [android, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Automated build of commit $GITHUB_SHA with Titanium SDK $TITANIUM_SDK. Not a stable release." \
            --prerelease \
            --latest=false
